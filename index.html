<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JKS Hindu Calendar</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>JKS Hindu Calendar</h1>
<div class="month-header">
  <button id="prev">◀</button>

  <h2 id="monthTitle">जून 2026</h2>

  <button id="next">▶</button>
</div>

<button id="todayBtn">आज</button>
<div class="weekdays">
  <div>रवि</div>
  <div>सोम</div>
  <div>मंगल</div>
  <div>बुध</div>
  <div>गुरु</div>
  <div>शुक्र</div>
  <div>शनि</div>
</div>
<div class="calendar"></div>

<script src="app.js?v=5"></script>

</body>
</html>
